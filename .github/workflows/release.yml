name: Release to PyPI

# Publishes to PyPI on a version tag using Trusted Publishing (OIDC): no API
# token stored in the repo. One-time setup on PyPI:
#   PyPI -> your project -> Publishing -> add a GitHub trusted publisher:
#     owner=eeshsaxena, repo=agent-guard, workflow=release.yml, environment=pypi
# Then: bump version in pyproject.toml + agentguard/__init__.py, tag, push tag.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
