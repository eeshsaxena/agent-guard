[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "See what your AI coding agent touches, and fence it in: a Claude Code hook that logs every tool call and blocks file access outside folders you allow, with a live dashboard."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Eesh Saxena" }]
keywords = ["claude", "claude-code", "ai-agent", "security", "sandbox", "hook", "audit", "guardrail", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/eeshsaxena/agent-guard"
Repository = "https://github.com/eeshsaxena/agent-guard"
Issues = "https://github.com/eeshsaxena/agent-guard/issues"

[project.scripts]
agentguard = "agentguard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["agentguard"]

[tool.hatch.build.targets.sdist]
include = ["agentguard", "README.md", "LICENSE", "tests"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
